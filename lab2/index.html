function Truck(color,weight,avgSpeed,brand,model){
    this.color=color;
    this.weight=weight;
    this.avgSpeed=avgSpeed;
    this.brand=brand;
    this.model=model;
        this.trip = function() {
        if (!this.driver) {

        } else {
            let message = "Driver " + this.driver.name + " ";
            message += this.driver.nightDriving ?
                "drives at night " :
                "does not drive at night ";
            message += "and has " + this.driver.experience + " years of experience";
            console.log(message);
        }
    };
};
Truck.prototype.AssignDriver = function(name, nightDriving, experience) {
    this.driver = {
        name: name,
        nightDriving: nightDriving,
        experience: experience
    };
};

class Square{
constructor(a){ this.a=a;};
  static help() {
        console.log("Square has got four right angleswith four equal sides.");
    }
     length() {
        console.log("Perimeter:", 4 * this.a);
    }

    square() {
        console.log("Area:", this.a * this.a);
    }

    info() {
        console.log("Sides: ", this.a, this.a, this.a, this.a);
        console.log("Angles: 90, 90, 90, 90");
        this.length();
        this.square();
    }

};

class Rectangle extends Square {
    constructor(a, b) {
        super(a);
        this.b = b;
    }

    static help() {
        console.log("Rectangle has got opposite equal sides and four right angles.");
    }

    length() {
        console.log("Perimeter:", 2 * (this.a + this.b));
    }

    square() {
        console.log("Area:", this.a * this.b);
    }

    info() {
        console.log("Sides:", this.a, this.b, this.a, this.b);
        console.log("Angles: 90, 90, 90, 90");
        this.length();
        this.square();
    }
}

class Rhombus extends Square {
    constructor(a, alpha, beta) {
        super(a);
        this.alpha = alpha;
        this.beta = beta;
    }

    static help() {
        console.log("Rhombus has four equal sides, opposite angles equal.");
    }

    length() {
        console.log("Perimeter:", 4 * this.a);
    }

    square() {
        console.log("Area:", this.a * this.a * Math.sin(this.alpha * Math.PI / 180));
    }

    info() {
        console.log("Sides:", this.a, this.a, this.a, this.a);
        console.log("Angles:", this.alpha, this.beta, this.alpha, this.beta);
        this.length();
        this.square();
    }
     get sideA() { return this.a; }
  set sideA(value) { this.a = value; }

  get angleAlpha() { return this.alpha; }
  set angleAlpha(value) { this.alpha = value; }

  get angleBeta() { return this.beta; }
  set angleBeta(value) { this.beta = value; }
}


 

class Parallelogram extends Rectangle {
    constructor(a, b, alpha, beta) {
        super(a, b);
        this.alpha = alpha;
        this.beta = beta;
    }

    static help() {
        console.log("Parallelogram has opposite equal sides and equal opposite angles.");
    }

    square() {
        console.log("Area:", this.a * this.b * Math.sin(this.alpha * Math.PI / 180));
    }

    info() {
        console.log("Sides:", this.a, this.b, this.a, this.b);
        console.log("Angles:", this.alpha, this.beta, this.alpha, this.beta);
        this.length();
        this.square();
    }
}

Square.help();
Rectangle.help();
Rhombus.help();
Parallelogram.help();

function PiMultiplier(x) {
  return function () {
    return Math.PI * x;
  };
}

const mul2 = PiMultiplier(2);
const mul3_2 = PiMultiplier(3 / 2);
const div2 = PiMultiplier(1 / 2);

console.log("PiMultiplier results:");
console.log("pi * 2 =", mul2());
console.log("pi * 3/2 =", mul3_2());
console.log("pi / 2 =", div2());
