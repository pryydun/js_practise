<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Lights Out</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Lights Out</h1>

    <div class="info">
      <div>Ходи: <span id="moves">0</span></div>
      <div>Час: <span id="timer">0</span> с</div>
      <div>Мінімум: <span id="target">-</span></div>
    </div>

    <div id="board" class="board"></div>

    <div class="buttons">
      <button id="newGameBtn">New Game</button>
      <button id="restartBtn">Restart</button>
    </div>

    <p id="message"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
